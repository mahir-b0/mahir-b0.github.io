<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <div class="desktop">
    <div class="window">
      <div class="titlebar">
        <span class="titlebar-icon" aria-hidden="true"></span>
        <span class="titlebar-text">C:\home\mahir{% if page.title %}\{{ page.title }}{% else %}\helloworld.exe{% endif %}</span>
        <span class="titlebar-buttons" aria-hidden="true">
          <span class="tb-btn tb-min">_</span><span class="tb-btn tb-max">□</span><span class="tb-btn tb-close">✕</span>
        </span>
      </div>
      <main class="window-body">
        {{ content }}
      </main>
    </div>
  </div>

  <div class="taskbar">
    <span class="start-btn">start</span>
    <span class="task-item">{% if page.title %}{{ page.title }}{% else %}helloworld.exe{% endif %}</span>
    <span class="tray"><span id="clock">12:00 PM</span></span>
  </div>

  <script>
    (function () {
      function tick() {
        var d = new Date(), h = d.getHours(), m = d.getMinutes();
        var ap = h >= 12 ? "PM" : "AM";
        h = h % 12 || 12;
        document.getElementById("clock").textContent =
          h + ":" + (m < 10 ? "0" : "") + m + " " + ap;
      }
      tick(); setInterval(tick, 15000);
    })();
  </script>
</body>
</html>
