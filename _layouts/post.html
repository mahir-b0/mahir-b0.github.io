---
layout: default
---
<article class="post">
  <p class="post-meta"><span class="prompt">$</span> cat {{ page.date | date: "%Y-%m-%d" }}/{{ page.slug | default: page.title | slugify }}.md</p>
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-body">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/blog/' | relative_url }}">&larr; back to /blog</a></p>
</article>
